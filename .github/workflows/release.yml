name: Java Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    env:
      JAVA_HOME: ${{ github.workspace }}/graalvm-ce-java11-22.3.3

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 11 from GraalVM
        run: |
          echo "${{ env.JAVA_HOME }}/bin" >> $GITHUB_PATH
          wget https://github.com/graalvm/graalvm-ce-builds/releases/download/vm-22.3.3/graalvm-ce-java11-linux-amd64-22.3.3.tar.gz
          tar -xvzf graalvm-ce-java11-linux-amd64-22.3.3.tar.gz
          ${{ env.JAVA_HOME }}/bin/gu install native-image

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and Test
        id: build
        continue-on-error: true  # Allow the workflow to continue if this fails
        run: ./gradlew clean fatJar

      - name: Delete tag on failure
        if: steps.build.outcome != 'success'
        run: |
          git push --delete origin ${GITHUB_REF#refs/tags/}
          exit 1  # Fail the workflow

      # The tag must match gradle.properties: it names the jar, the wheel, and the GitHub Release,
      # and a mismatch would publish the wrong version to PyPI.
      - name: Resolve and verify version
        id: ver
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          declared="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "$version" != "$declared" ]]; then
            echo "::error::Tag version ($version) != gradle.properties version ($declared). Bump gradle.properties or fix the tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Stage release assets: a stable-named codeanalyzer.jar (what the installer fetches), the
      # Neo4j schema contract (platform-independent, version-locked to this build), and the
      # cargo-dist-style install script.
      - name: Stage release assets (jar + Neo4j schema + installer)
        run: |
          mkdir -p release-assets
          cp build/libs/codeanalyzer-${{ steps.ver.outputs.version }}.jar release-assets/codeanalyzer.jar
          cp build/libs/codeanalyzer-${{ steps.ver.outputs.version }}.jar "release-assets/codeanalyzer-${{ steps.ver.outputs.version }}.jar"
          java -jar build/libs/codeanalyzer-${{ steps.ver.outputs.version }}.jar --emit schema > release-assets/schema.neo4j.json
          cp packaging/install/codeanalyzer-installer.sh release-assets/codeanalyzer-installer.sh
          ls -lh release-assets

      # The PyPI wheel is published by release-pypi.yml, which runs when this workflow publishes
      # the GitHub Release and builds the wheel from the released codeanalyzer.jar asset.
      - name: Build Changelog
        id: gen_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          failOnError: "true"
          configuration: .github/workflows/release_config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # cargo-dist-style release notes: install one-liner + downloads, then the generated changelog.
      - name: Compose release notes
        id: notes
        run: |
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "pip install codeanalyzer-java==${{ steps.ver.outputs.version }}   # bundles a JVM; installs the canjv launcher"
            echo '```'
            echo
            echo "Or the jar with a \`codeanalyzer\` launcher (requires Java 11+):"
            echo
            echo '```sh'
            echo "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ steps.ver.outputs.version }}/codeanalyzer-installer.sh | sh"
            echo '```'
            echo
            echo "Or run the JAR directly (requires Java 11+):"
            echo
            echo '```sh'
            echo "# JSON output, at the analysis level you ask for"
            echo "java -jar codeanalyzer.jar -i /path/to/project -a 4 -o ./out          # writes out/analysis.json"
            echo
            echo "# Neo4j projection - always full depth, so it takes no --analysis-level"
            echo "java -jar codeanalyzer.jar -i /path/to/project --emit neo4j -o ./out  # writes out/graph.cypher"
            echo '```'
            echo
            echo "## Downloads"
            echo
            echo "| Asset | Description |"
            echo "| --- | --- |"
            echo "| \`codeanalyzer.jar\` | Self-contained analyzer (run with \`java -jar\`) |"
            echo "| \`codeanalyzer-installer.sh\` | Installer that fetches the jar and adds a \`codeanalyzer\` launcher |"
            echo "| \`schema.neo4j.json\` | Neo4j graph schema contract (node labels, relationships, DDL) |"
            echo
            echo "---"
            echo
            echo "${{ steps.gen_changelog.outputs.changelog }}"
          } > release-notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/codeanalyzer.jar
            release-assets/codeanalyzer-${{ steps.ver.outputs.version }}.jar
            release-assets/schema.neo4j.json
            release-assets/codeanalyzer-installer.sh
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Record this release's schema artifacts in the shared contract repo
      # (codellm-devkit/codeanalyzer-schema): the Neo4j graph contract, and the JSON
      # samples that repo documents as "unedited analyzer output on the analyzers' own
      # test fixtures". Delivered as a pull request rather than a push, so two analyzers
      # releasing close together cannot race and a contract change stays reviewable.
      #
      # The destination line is derived from the emitted `schema_version` rather than
      # hard-coded, and the two projections carry that version independently -- today
      # every analyzer reads 2.0.0 on both, so everything lands under v2/.
      - name: Record schemas in codeanalyzer-schema
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # The org PAT already used for the cross-repo announcement in this workflow. It
          # needs contents:write plus pull-requests:write on codeanalyzer-schema; if this
          # step 403s, CLDK_AUTH_TOKEN is the PAT documented as carrying repo scope.
          GH_TOKEN: ${{ secrets.ORG_DISCUSSIONS_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          STAGE="$RUNNER_TEMP/schema-stage"
          WORK="$RUNNER_TEMP/schema-repo"
          mkdir -p "$STAGE"
          # Samples are unedited analyzer output on this repo's own fixtures, staged under
          # the exact filenames the contract repo keeps them under. The graph contract was
          # already emitted for the release assets above.
          LANG=java
          JAR="build/libs/codeanalyzer-${VERSION}.jar"
          java -jar "$JAR" -i src/test/resources/test-applications/dataflow-test           -o "$STAGE/run-l4"   -a 4
          java -jar "$JAR" -i src/test/resources/test-applications/enum-record-bodies-test -o "$STAGE/run-enum" -a 2
          cp "$STAGE/run-l4/analysis.json"   "$STAGE/analysis.l4.sample.json"
          cp "$STAGE/run-enum/analysis.json" "$STAGE/analysis.enum-record.sample.json"
          cp release-assets/schema.neo4j.json "$STAGE/schema.neo4j.json"

          # One line per projection: analysis.json and the graph contract carry their
          # schema_version independently, so each destination is derived from its own document.
          JSON_LINE="v$(jq -r '.schema_version | split(".")[0]' "$STAGE/analysis.l4.sample.json")"
          NEO_LINE="v$(jq -r '.schema_version | split(".")[0]' "$STAGE/schema.neo4j.json")"
          echo "analysis.json -> $JSON_LINE/json/$LANG/ ; graph contract -> $NEO_LINE/neo4j/$LANG/"

          if ! git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/codellm-devkit/codeanalyzer-schema.git" "$WORK"; then
            echo "::error::cannot clone codeanalyzer-schema. Does ORG_DISCUSSIONS_TOKEN carry contents:write on it? CLDK_AUTH_TOKEN is the PAT documented with repo scope."
            exit 1
          fi

          mkdir -p "$WORK/$JSON_LINE/json/$LANG" "$WORK/$NEO_LINE/neo4j/$LANG"
          cp "$STAGE"/*.sample.json "$WORK/$JSON_LINE/json/$LANG/"
          cp "$STAGE/schema.neo4j.json" "$WORK/$NEO_LINE/neo4j/$LANG/schema.neo4j.json"

          cd "$WORK"
          BRANCH="uptake/$LANG-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "codeanalyzer-schema already records these artifacts; nothing to open."
            exit 0
          fi
          git commit -m "chore($LANG): record codeanalyzer-$LANG v${VERSION} schemas"
          if ! git push -f origin "$BRANCH"; then
            echo "::error::cannot push to codeanalyzer-schema. The token needs contents:write there."
            exit 1
          fi
          gh pr create --repo codellm-devkit/codeanalyzer-schema \
            --head "$BRANCH" --base main \
            --title "chore($LANG): record codeanalyzer-$LANG v${VERSION} schemas" \
            --body "Emitted by the codeanalyzer-$LANG v${VERSION} release workflow. Graph contract to \`$NEO_LINE/neo4j/$LANG/\`, JSON samples to \`$JSON_LINE/json/$LANG/\`; both paths come from the schema_version in the emitted documents rather than being hard-coded. The samples are unedited analyzer output on this analyzer's own test fixtures, the provenance that repo's README documents. Validate with \`python3 scripts/check.py\`." \
            || echo "::notice::a PR for $BRANCH already exists; its branch was updated in place."
