# Build fat platform wheels (bundled JVM via jpackage), publish them as GitHub
# release assets, and serve a PEP 503 index from GitHub Pages so users can:
#   pip install codeanalyzer-java --extra-index-url <pages-url>/simple/
#
# No PyPI upload (the wheels exceed PyPI's 100 MB limit); GitHub release assets
# allow up to 2 GB and let us use plain linux_x86_64 tags.
name: pypi-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build wheels for, e.g. v2.4.0"
        required: true

permissions:
  contents: write   # upload wheels to the release
  pages: write      # publish the simple index
  id-token: write   # GitHub Pages deployment

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: wheel (${{ matrix.plat }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,        plat: macosx_11_0_arm64 }
          - { runner: macos-13,        plat: macosx_10_9_x86_64 }
          - { runner: ubuntu-latest,   plat: linux_x86_64 }
          - { runner: ubuntu-24.04-arm, plat: linux_aarch64 }
          - { runner: windows-latest,  plat: win_amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # A standard JDK (NOT GraalVM): jpackage bundles HotSpot for full fidelity.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the analyzer jar
        run: ./gradlew fatJar

      - name: jpackage app-image (trimmed JVM + jar)
        run: |
          VER=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "VER=$VER" >> "$GITHUB_ENV"
          jpackage --type app-image \
            --name codeanalyzer \
            --input build/libs \
            --main-jar "codeanalyzer-${VER}.jar" \
            --main-class com.ibm.cldk.CodeAnalyzer \
            --java-options -XX:+UseParallelGC \
            --dest build/jpackage

      - name: Pack platform wheel
        env:
          # Wheel version comes from the release tag (strip leading v); fall back to jar version.
          CODEANALYZER_VERSION: ${{ env.VER }}
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python packaging/pypi/build_wheel.py \
            --runtime build/jpackage \
            --plat-name ${{ matrix.plat }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.plat }}
          path: packaging/pypi/dist/*.whl

  publish:
    name: index + release upload
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wheel-*
          merge-multiple: true

      - name: Collect wheels
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          ls -lh dist

      - name: Generate PEP 503 simple index
        run: |
          python packaging/pypi/gen_index.py \
            --wheels dist \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${TAG}" \
            --out public

      - name: Attach wheels to the release
        run: gh release upload "${TAG}" dist/*.whl --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy-pages:
    name: deploy index to Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
