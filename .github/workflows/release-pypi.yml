name: Publish to PyPI

# Runs after "Java Release" succeeds: builds the codeanalyzer-java wheel from the released
# codeanalyzer.jar asset (byte-identical to what the installer fetches) and publishes it with PyPI
# Trusted Publishing. The publisher on PyPI is bound to this file name and the `pypi` environment.
# workflow_run (not `release: published`) because a release created with GITHUB_TOKEN never
# triggers other workflows. workflow_dispatch re-publishes a tag if a run failed.

on:
  workflow_run:
    workflows: ["Java Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v3.0.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pypi:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    environment:
      name: pypi
      url: https://pypi.org/p/codeanalyzer-java
    permissions:
      contents: read
      id-token: write          # PyPI Trusted Publishing (OIDC) -- no API token needed

    steps:
      - name: Resolve tag and version
        id: ver
        run: |
          # For a tag push, workflow_run.head_branch is the tag name.
          tag="${{ inputs.tag || github.event.workflow_run.head_branch }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo ">>> Publishing $tag"

      - name: Check out the tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: Download the released jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/libs
          gh release download "${{ steps.ver.outputs.tag }}" -R "$GITHUB_REPOSITORY" -p codeanalyzer.jar -D build/libs
          mv build/libs/codeanalyzer.jar "build/libs/codeanalyzer-${{ steps.ver.outputs.version }}.jar"
          ls -lh build/libs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel
        env:
          PKG_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -m pip install --upgrade build hatchling
          ./packaging/python/build_wheel.sh

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packaging/python/dist
          # Re-runs stay idempotent: a version already on PyPI is skipped, not a 400.
          skip-existing: true

  # Publish only after PyPI succeeds, so the pinned canjv package is available.
  # A tap failure can be retried without rebuilding or republishing the wheel.
  homebrew:
    needs: pypi
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.pypi.outputs.version }}
    steps:
      - name: Check out release automation
        uses: actions/checkout@v5
        # Use the default branch so workflow_dispatch can backfill older releases.
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate Homebrew formula from the published wheel
        run: |
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 \
            "https://pypi.org/pypi/codeanalyzer-java/${VERSION}/json" -o pypi.json
          wheel="$(jq -er --arg version "$VERSION" \
            '[.urls[] | select(.filename == ("codeanalyzer_java-" + $version + "-py3-none-any.whl") and .yanked == false)] | if length == 1 then .[0] else error("Expected one non-yanked universal wheel") end' pypi.json)"
          WHEEL_URL="$(jq -er '.url' <<< "$wheel")"
          SHA256="$(jq -er '.digests.sha256' <<< "$wheel")"
          export WHEEL_URL SHA256
          bash packaging/homebrew/generate_formula.sh > codeanalyzer-java.rb
          ruby -c codeanalyzer-java.rb

      - name: Check out the shared tap
        uses: actions/checkout@v5
        with:
          repository: codellm-devkit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the formula
        run: |
          mkdir -p tap/Formula
          cp codeanalyzer-java.rb tap/Formula/codeanalyzer-java.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/codeanalyzer-java.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "codeanalyzer-java ${VERSION}"
          git pull --rebase
          git push
